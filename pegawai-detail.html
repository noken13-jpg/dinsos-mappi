<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Profil pegawai Dinas Sosial Kabupaten Mappi"><title>Profil Pegawai | Dinas Sosial Kabupaten Mappi</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>.profile-card{max-width:680px;margin:auto;padding:36px;border-radius:24px;text-align:center;background:linear-gradient(145deg,rgba(16,29,61,.9),rgba(7,16,39,.95));border:1px solid var(--line)}.profile-card .avatar{width:92px;height:92px;font-size:30px;margin:0 auto 20px}</style></head><body><main class="section" style="padding-top:170px;min-height:90vh"><div class="container"><a href="data-pegawai.html" class="btn btn-ghost" style="margin-bottom:25px"><i class="fa-solid fa-arrow-left"></i> Kembali ke Data Pegawai</a><article id="profile" class="profile-card"><p class="notice">Memuat profil pegawai...</p></article></div></main><script>const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('no');fetch('pegawai.json').then(r=>r.json()).then(d=>{const p=d.find(x=>String(x.no)===id),el=document.querySelector('#profile');if(!p){el.innerHTML='<p class="notice">Profil pegawai tidak ditemukan.</p>';return}const initials=p.nama.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();el.innerHTML=`<div class="avatar">${initials}</div><p class="eyebrow">Profil Pegawai</p><h1>${esc(p.nama)}</h1><p class="hero-copy" style="margin:15px auto">${esc(p.jabatan)}</p><div class="notice" style="text-align:left;margin-top:24px"><strong>NIP</strong><br>${esc(p.nip)}<br><br><strong>Unit kerja</strong><br>Informasi unit kerja belum tersedia dalam sumber data pegawai.</div>`})</script></body></html>
